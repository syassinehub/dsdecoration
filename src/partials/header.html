<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#3d4b5a">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="DS Décoration">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site_url}}assets/img/photos/sejour.jpg">
  <link rel="icon" type="image/png" href="{{root}}favicon.png">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="preload" href="{{root}}assets/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/js/vendor/lenis.css">
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
      setTimeout(function () { if (!window.__motion) document.documentElement.classList.remove('motion'); }, 4000);
    }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HousePainter",
    "name": "DS DECORATION SAS",
    "url": "{{site_url}}",
    "logo": "{{site_url}}assets/img/logo.png",
    "image": "{{site_url}}assets/img/photos/sejour.jpg",
    "telephone": "+33749150150",
    "email": "ds.decoration@yahoo.fr",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "291 route de Loex",
      "postalCode": "74380",
      "addressLocality": "Nangy",
      "addressCountry": "FR"
    },
    "areaServed": ["Haute-Savoie", "Genevois français", "Rhône"],
    "founder": "Sébastien De Ana"
  }
  </script>
</head>
<body data-page="{{label}}">
  <a class="skip" href="#contenu">Aller au contenu</a>

  <div class="curtain" aria-hidden="true">
    <span class="curtain-layer c-purple"></span>
    <span class="curtain-layer c-red"></span>
    <span class="curtain-layer c-orange"><span class="curtain-label">{{label}}</span></span>
  </div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{root}}"><img src="{{root}}assets/img/logo.png" alt="DS Décoration, le spécialiste de votre intérieur" width="927" height="243"></a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav class="menu" id="menu" aria-label="Menu principal">
        <ul>
          <li><a href="{{root}}"{{nav:home}}>Accueil</a></li>
          <li><a href="{{root}}nos-realisations/"{{nav:realisations}}>Réalisations</a></li>
          <li><a href="{{root}}contact/"{{nav:contact}}>Contact</a></li>
        </ul>
        <a class="header-phone" href="tel:{{phone_href}}">{{phone}}</a>
        <a class="btn btn-orange" href="{{root}}contact/">Demander un devis</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
